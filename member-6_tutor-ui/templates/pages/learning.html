{% extends "base.html" %}

{% block content %}
<div class="learning-grid">
    <!-- Active Roadmap -->
    <div class="glass-card roadmap-card animate-fade-in" style="animation-delay: 0.1s">
        <div class="card-header">
            <h3 class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="accent-icon"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                Current Roadmap
            </h3>
        </div>
        <div class="roadmap-header">
            <h2 id="rm-subject">--</h2>
            <div class="rm-meta">
                Level: <span id="rm-level" class="badge badge-primary">--</span>
                &nbsp;&bull;&nbsp; 
                ETA: <span id="rm-eta">--</span>
            </div>
        </div>
        
        <div class="roadmap-timeline" id="rm-timeline">
            <div class="loading-spinner">Loading timeline...</div>
        </div>
    </div>

    <!-- Recommendations -->
    <div class="glass-card rec-card animate-fade-in" style="animation-delay: 0.2s">
        <div class="card-header">
            <h3 class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="accent-icon"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                Recommended Resources
            </h3>
            <button class="btn btn-secondary btn-sm" onclick="window.Notifications.info('Refreshing...', 'Fetching new recommendations')">Refresh</button>
        </div>
        <div class="recommendation-list" id="rec-list">
            <div class="loading-spinner">Loading recommendations...</div>
        </div>
    </div>
</div>

<style>
.learning-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
}

@media (max-width: 1100px) {
    .learning-grid { grid-template-columns: 1fr; }
}

.roadmap-header {
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-primary);
}
.roadmap-header h2 {
    font-size: 2rem;
    margin-bottom: 8px;
}
.rm-meta {
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.roadmap-timeline {
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
    padding-left: 20px;
    border-left: 2px dashed var(--border-primary);
    margin-left: 12px;
}

.milestone {
    position: relative;
    padding-bottom: 32px;
    padding-left: 24px;
}
.milestone:last-child {
    padding-bottom: 0;
}
.milestone::before {
    content: '';
    position: absolute;
    left: -29px; /* adjust for border */
    top: 0;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--bg-secondary);
    border: 3px solid var(--border-secondary);
    z-index: 2;
    transition: all var(--trans-fast);
}
.milestone.active::before {
    border-color: var(--accent-primary);
    background: var(--accent-glow);
    box-shadow: 0 0 10px var(--accent-glow);
}
.milestone.completed::before {
    border-color: var(--status-success);
    background: var(--status-success);
}

.ms-title {
    font-size: 1.125rem;
    font-weight: 600;
    margin: -4px 0 4px 0;
}
.ms-meta {
    font-size: 0.75rem;
    color: var(--text-tertiary);
    margin-bottom: 12px;
}
.subtopics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.subtopic {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    color: var(--text-secondary);
}
.subtopic.completed {
    border-color: var(--status-success-muted);
    color: var(--status-success);
}

.recommendation-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.rec-item {
    padding: 16px;
    border-radius: 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    transition: transform var(--trans-fast), border-color var(--trans-fast);
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.rec-item:hover {
    transform: translateY(-2px);
    border-color: var(--border-secondary);
}
.rec-title {
    font-weight: 600;
    font-size: 1rem;
    color: var(--text-primary);
}
.rec-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-tertiary);
}
</style>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/learning.js"></script>
{% endblock %}
