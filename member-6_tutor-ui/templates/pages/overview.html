{% extends "base.html" %}

{% block content %}
<div class="overview-grid">
    <!-- Context Card -->
    <div class="glass-card context-card animate-fade-in" style="animation-delay: 0.1s">
        <div class="card-header">
            <h3 class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="accent-icon"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
                Current Focus
            </h3>
            <span class="badge badge-primary" id="ui-app">Loading...</span>
        </div>
        <div class="context-info">
            <h2 id="ui-subject">--</h2>
            <p id="ui-topic" class="text-muted">--</p>
        </div>
    </div>

    <!-- Session Stats -->
    <div class="glass-card session-card animate-fade-in" style="animation-delay: 0.2s">
        <div class="card-header">
            <h3 class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="accent-icon"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Active Session
            </h3>
        </div>
        <div class="stat-group">
            <div class="stat">
                <div class="stat-value" id="ui-session-time">--</div>
                <div class="stat-label">Duration</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="ui-session-events">--</div>
                <div class="stat-label">Events Processed</div>
            </div>
        </div>
    </div>

    <!-- Friction Meter -->
    <div class="glass-card friction-card animate-fade-in" style="animation-delay: 0.3s">
        <div class="card-header">
            <h3 class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="accent-icon"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                Cognitive Friction
            </h3>
            <span class="badge" id="ui-friction-badge">--</span>
        </div>
        <div class="friction-meter">
            <div class="meter-track">
                <div class="meter-fill" id="ui-friction-fill" style="width: 0%"></div>
            </div>
            <div class="meter-labels">
                <span>0.0</span>
                <span>0.5</span>
                <span>1.0</span>
            </div>
        </div>
        <p class="friction-value">Score: <span id="ui-friction-score">0.00</span></p>
    </div>

    <!-- Recent Episodes (Spans 2 columns on wide screens) -->
    <div class="glass-card episodes-card animate-fade-in" style="animation-delay: 0.4s">
        <div class="card-header">
            <h3 class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="accent-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Recent Episodes
            </h3>
            <a href="/history" class="btn btn-secondary btn-sm">View All</a>
        </div>
        <div class="episodes-list" id="ui-episodes-list">
            <div class="loading-spinner">Loading...</div>
        </div>
    </div>
</div>

<style>
.overview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
}

.episodes-card {
    grid-column: span 3;
}

@media (max-width: 1100px) {
    .overview-grid { grid-template-columns: repeat(2, 1fr); }
    .friction-card { grid-column: span 2; }
    .episodes-card { grid-column: span 2; }
}
@media (max-width: 768px) {
    .overview-grid { grid-template-columns: 1fr; }
    .friction-card, .episodes-card { grid-column: span 1; }
}

.accent-icon {
    color: var(--accent-primary);
}

.text-muted {
    color: var(--text-secondary);
    font-size: 1.125rem;
}

.context-info h2 {
    font-size: 2rem;
    margin-bottom: 4px;
    background: -webkit-linear-gradient(45deg, var(--text-primary), var(--accent-primary));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.stat-group {
    display: flex;
    gap: 32px;
}
.stat-value {
    font-size: 2.25rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
}
.stat-label {
    color: var(--text-tertiary);
    font-size: 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
}

.friction-meter {
    margin: 24px 0 12px;
}
.meter-track {
    height: 12px;
    background: var(--bg-tertiary);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid var(--border-primary);
    position: relative;
}
.meter-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--status-success) 0%, var(--status-warning) 50%, var(--status-danger) 100%);
    border-radius: 99px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.meter-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: var(--text-tertiary);
    font-size: 0.75rem;
    font-weight: 600;
}
.friction-value {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.875rem;
}
.friction-value span {
    color: var(--text-primary);
    font-weight: 700;
    font-size: 1rem;
}

.episodes-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.episode-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-radius: 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    transition: transform var(--trans-fast), border-color var(--trans-fast);
}
.episode-item:hover {
    transform: translateX(4px);
    border-color: var(--border-secondary);
}
.episode-main h4 {
    margin: 0 0 4px 0;
}
.episode-meta {
    font-size: 0.875rem;
    color: var(--text-tertiary);
}
.btn-sm {
    padding: 6px 12px;
    font-size: 0.75rem;
}
</style>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/overview.js"></script>
{% endblock %}
