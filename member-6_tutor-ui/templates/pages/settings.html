{% extends "base.html" %}

{% block content %}
<div class="settings-grid">
    <!-- General Settings -->
    <div class="glass-card animate-fade-in" style="animation-delay: 0.1s">
        <div class="card-header">
            <h3 class="card-title">General Preferences</h3>
        </div>
        <div class="form-group">
            <label class="form-label">Theme</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="theme" value="dark" checked onchange="window.App.applyTheme('dark')"> Dark Mode
                </label>
                <label class="radio-label">
                    <input type="radio" name="theme" value="light" onchange="window.App.applyTheme('light')"> Light Mode
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Notification Cooldown (minutes)</label>
            <input type="number" class="form-input" value="5" min="1" max="60">
        </div>
        <div class="form-group">
            <label class="toggle-label">
                <input type="checkbox" class="toggle-input" checked>
                <span class="toggle-slider"></span>
                <span class="toggle-text">Enable Do Not Disturb (DND) automatically on high friction</span>
            </label>
        </div>
    </div>

    <!-- Autonomy & Privacy -->
    <div class="glass-card animate-fade-in" style="animation-delay: 0.2s">
        <div class="card-header">
            <h3 class="card-title">Autonomy & Privacy</h3>
        </div>
        <div class="form-group">
            <label class="form-label">Default Autonomy Level</label>
            <select class="form-input" id="autonomy-select">
                <option value="0">L0 - Disabled</option>
                <option value="1">L1 - Passive Observation</option>
                <option value="2" selected>L2 - Suggestions</option>
                <option value="3">L3 - Co-Pilot</option>
                <option value="4">L4 - Supervised Autonomous</option>
                <option value="5">L5 - Fully Autonomous</option>
            </select>
            <p class="text-muted" style="margin-top: 8px; font-size: 0.75rem;">
                Higher autonomy allows Tesseract to take actions on your behalf. Level 4 and 5 require explicit approvals via dialogs for consequential actions.
            </p>
        </div>
        <div class="form-group" style="margin-top: 24px;">
            <label class="form-label">Observation Sources</label>
            <label class="toggle-label" style="margin-bottom: 8px;">
                <input type="checkbox" class="toggle-input" checked>
                <span class="toggle-slider"></span>
                <span class="toggle-text">Browser Events</span>
            </label>
            <label class="toggle-label" style="margin-bottom: 8px;">
                <input type="checkbox" class="toggle-input" checked>
                <span class="toggle-slider"></span>
                <span class="toggle-text">IDE Events (VS Code)</span>
            </label>
            <label class="toggle-label">
                <input type="checkbox" class="toggle-input" checked>
                <span class="toggle-slider"></span>
                <span class="toggle-text">OS Window Tracking</span>
            </label>
        </div>
        <div class="form-actions" style="margin-top: 32px; text-align: right;">
            <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>
</div>

<style>
.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 1000px;
}
@media (max-width: 900px) {
    .settings-grid { grid-template-columns: 1fr; }
}

.form-group {
    margin-bottom: 24px;
}
.form-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-primary);
}
.form-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-primary);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-family: inherit;
    transition: border-color var(--trans-fast);
}
.form-input:focus {
    outline: none;
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 2px var(--accent-muted);
}

.radio-group {
    display: flex;
    gap: 16px;
}
.radio-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: var(--text-secondary);
}

/* Custom Toggle Switch */
.toggle-label {
    display: flex;
    align-items: center;
    cursor: pointer;
    gap: 12px;
}
.toggle-input {
    display: none;
}
.toggle-slider {
    position: relative;
    width: 44px;
    height: 24px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: 99px;
    transition: var(--trans-fast);
}
.toggle-slider::before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 2px;
    bottom: 2px;
    background-color: var(--text-secondary);
    border-radius: 50%;
    transition: var(--trans-fast);
}
.toggle-input:checked + .toggle-slider {
    background-color: var(--accent-primary);
    border-color: var(--accent-primary);
}
.toggle-input:checked + .toggle-slider::before {
    transform: translateX(20px);
    background-color: white;
}
.toggle-text {
    color: var(--text-secondary);
    font-size: 0.875rem;
}
</style>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/settings.js"></script>
{% endblock %}
